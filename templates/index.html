<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список участия</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Список участия</h1>

    <!-- ===================== -->
    <!-- СПИСОК -->
    <!-- ===================== -->
    <div class="list">

        {% for row in schedule %}
        <div class="card" data-id="{{ row.id }}">

            <!-- СКРЫТЫЕ ДЕЙСТВИЯ (SWIPE) -->
            <div class="card-actions">
                <button class="delete" title="Удалить">🗑</button>
                <button class="move-up" title="Вверх">⬆️</button>
                <button class="move-down" title="Вниз">⬇️</button>
                <button class="edit-record-btn" title="Редактировать">✏️</button>
            </div>

            <!-- ВИДИМАЯ ЧАСТЬ -->
            <div class="card-content">

                <!-- ДАТА -->
                <div class="cell date">
                    <span class="date-text">{{ row.date_fmt }}</span>
                    <input
                        type="date"
                        class="date-input"
                        value="{{ row.date }}"
                        hidden
                    >
                </div>

                <!-- ФИО -->
                <div class="cell person">
                    <span class="person-text">{{ row.person }}</span>
                    <input
                        type="text"
                        class="person-input"
                        value="{{ row.person }}"
                        hidden
                    >
                </div>

                <!-- УЧАСТИЕ -->
                <div class="cell status
                    {% if row.status == '+' %}plus{% elif row.status == '-' %}minus{% endif %}
                ">
                    <span class="status-text">{{ row.status or '' }}</span>
                    <select class="status-select" hidden>
                        <option value="" {% if not row.status %}selected{% endif %}></option>
                        <option value="+" {% if row.status == '+' %}selected{% endif %}>+</option>
                        <option value="-" {% if row.status == '-' %}selected{% endif %}>-</option>
                    </select>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>

    <!-- ===================== -->
    <!-- ДОБАВЛЕНИЕ -->
    <!-- ===================== -->
    <div class="add-form">
        <h2>Добавить участника</h2>

        <form method="post" action="/add">
            <input
                type="text"
                name="person"
                placeholder="Фамилия Имя"
                required
            >

            <select name="status">
                <option value="">—</option>
                <option value="+">+</option>
                <option value="-">-</option>
            </select>

            <button type="submit">Добавить</button>
        </form>
    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
